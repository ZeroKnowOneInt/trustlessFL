[project]
name = "trustlessfl"
version = "0.1.0"
description = "Flower federated learning with private MPC boundary checks and exact modular recovery"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.0",
    "flwr==1.36.0",
    "cryptography>=46.0.7,<47",
    "tomli-w>=1.2,<2",
]

[project.optional-dependencies]
client = ["torch==2.8.0"]
aggregator = ["torch==2.8.0"]
simulation = ["flwr[simulation]==1.36.0"]
seed-mpc = ["flwr[simulation]==1.36.0", "ray==2.55.1", "torch==2.8.0"]
gpu = ["torch==2.8.0"]
fast-crypto = ["gmpy2>=2.2,<3"]
author-asr = ["gmpy2>=2.2,<3", "pycryptodomex>=3.23,<4", "dill>=0.4,<0.5"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", extra = "gpu" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=9.1,<10"]

[project.scripts]
trustlessfl-distributed = "trustlessfl.seed_mpc_distributed:main"
trustlessfl-mpc = "trustlessfl.seed_mpc_setup:main"
trustlessfl-seed-mpc = "trustlessfl.seed_mpc_user:main"
aion-demo = "trustlessfl.demo:main"
aion-peer = "trustlessfl.peer_service:main"
aion-author-asr = "trustlessfl.aion_source_server:cli"

[tool.hatch.build.targets.wheel]
packages = ["trustlessfl"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.flwr.app]
publisher = "trustlessfl"

[tool.flwr.app.components]
serverapp = "trustlessfl.seed_mpc_server_app:app"
clientapp = "trustlessfl.seed_mpc_client_app:app"

[tool.flwr.app.config]
deployment-file = "UNCONFIGURED"
output-dir = "UNCONFIGURED"
num-clients = 4
backend = "numpy"
simulation-workers = 1
